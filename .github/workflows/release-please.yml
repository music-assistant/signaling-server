name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          # Falls back to the default GITHUB_TOKEN when the PAT is not set
          # (e.g. on forks). Note: releases created with the default token do
          # not trigger the release workflow; the org repo sets
          # RELEASE_PLEASE_TOKEN for that reason.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
